[project]
name = "mudrika"
version = "0.2.0"
description = "Mudrika: HTTP 402 prepaid-credit authorization for AI agents, with a SAM 3.1 credential-matching reference service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "redis>=5.0",
  "pynacl>=1.5",
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
credentials = ["pillow>=10.1", "python-multipart>=0.0.9", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "uvicorn>=0.29", "pillow>=10.1", "python-multipart>=0.0.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mudrika*", "credentials*"]

[tool.setuptools.package-data]
credentials = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
